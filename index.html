<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquaflow - হাইড্রেটেড থাকুন</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#06b6d4">
</head>
<body class="bg-slate-950 text-white min-h-screen flex flex-col justify-between p-4 font-sans">

    <!-- Header -->
    <header class="text-center py-4">
        <h1 class="text-2xl font-bold text-cyan-400">💧 একোয়াফ্লো (Aquaflow)</h1>
        <p class="text-xs text-slate-400">আপনার স্মার্ট ওয়াটার রিমাইন্ডার</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-md w-full mx-auto space-y-4">
        
        <!-- Status Card -->
        <div class="bg-slate-900 border border-slate-800 p-4 rounded-2xl flex items-center justify-between shadow-lg">
            <div>
                <h2 id="dayStatus" class="text-lg font-bold text-amber-400">দিন বন্ধ আছে</h2>
                <p id="subStatus" class="text-xs text-slate-400">শুরু করতে নিচের বাটনে চাপুন</p>
            </div>
            <button id="toggleBtn" onclick="toggleDay()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition">
                শুরু করুন
            </button>
        </div>

        <!-- Progress Card -->
        <div class="bg-slate-900 border border-slate-800 p-6 rounded-2xl text-center space-y-4 shadow-lg">
            <div class="relative w-32 h-48 mx-auto bg-slate-800 rounded-2xl overflow-hidden border-2 border-slate-700 flex items-end">
                <div id="waterFill" class="w-full bg-cyan-500 transition-all duration-500" style="height: 0%;"></div>
                <div class="absolute inset-0 flex items-center justify-center font-bold text-lg text-white drop-shadow">
                    <span id="percentText">0%</span>
                </div>
            </div>

            <div>
                <p id="progressText" class="text-2xl font-extrabold text-cyan-300">০ / ৩০০০ মিলি</p>
                <p class="text-xs text-slate-400">দৈনিক লক্ষ্যমাত্রা</p>
            </div>

            <!-- Add Water Buttons -->
            <div class="grid grid-cols-2 gap-3 pt-2">
                <button onclick="addWater(250)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-400 font-semibold py-3 rounded-xl transition">
                    + ২৫০ মিলি
                </button>
                <button onclick="addWater(500)" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 text-cyan-400 font-semibold py-3 rounded-xl transition">
                    + ৫০০ মিলি
                </button>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center text-xs text-slate-500 py-2">
        Aquaflow PWA &copy; 2026
    </footer>

    <!-- JavaScript Logic -->
    <script>
        let isRunning = false;
        let currentMl = 0;
        let targetMl = 3000;

        function toggleDay() {
            isRunning = !isRunning;
            const dayStatus = document.getElementById('dayStatus');
            const subStatus = document.getElementById('subStatus');
            const toggleBtn = document.getElementById('toggleBtn');

            if (isRunning) {
                dayStatus.innerText = "দিন চালু আছে (সক্রিয়)";
                dayStatus.className = "text-lg font-bold text-emerald-400";
                subStatus.innerText = "নিয়মিত পানি পানের রিমাইন্ডার চলছে";
                toggleBtn.innerText = "দিন শেষ করুন";
                toggleBtn.className = "bg-rose-500 hover:bg-rose-400 text-white font-bold px-4 py-2 rounded-xl text-sm transition";
            } else {
                dayStatus.innerText = "দিন বন্ধ আছে";
                dayStatus.className = "text-lg font-bold text-amber-400";
                subStatus.innerText = "শুরু করতে নিচের বাটনে চাপুন";
                toggleBtn.innerText = "শুরু করুন";
                toggleBtn.className = "bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-sm transition";
                currentMl = 0;
            }
            updateUI();
        }

        function addWater(amount) {
            if (!isRunning) {
                alert("আগে 'শুরু করুন' বাটনে চাপ দিয়ে দিনটি চালু করুন!");
                return;
            }
            currentMl = Math.min(currentMl + amount, targetMl);
            updateUI();
        }

        function updateUI() {
            document.getElementById('progressText').innerText = `${currentMl} / ${targetMl} মিলি`;
            let percentage = Math.round((currentMl / targetMl) * 100);
            document.getElementById('waterFill').style.height = percentage + '%';
            document.getElementById('percentText').innerText = percentage + '%';
        }
    </script>
</body>
</html>
